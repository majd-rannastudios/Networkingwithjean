<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin The Wheel — room screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow: hidden; }
  .stage { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 4vh 5vw; gap: 3vh; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top .brand { font-size: 1.1vw; }
  .round { font-size: 1.6vw; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--orange); }
  .middle { display: grid; grid-template-columns: 1.05fr 1fr; gap: 5vw; align-items: center; }
  .clock { font-size: 17vw; font-weight: 800; line-height: 0.82; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  .clock.urgent { color: var(--orange); }
  .clock-note { font-size: 1.5vw; color: var(--muted); margin-top: 1.5vh; }
  .circles { display: grid; gap: 1.4vh; }
  .c { display: flex; align-items: center; gap: 1.4vw; }
  .c .dot { width: 3.4vw; height: 3.4vw; border-radius: 50%; flex: none; }
  .c .nm { font-size: 1.9vw; font-weight: 700; flex: 1; }
  .c .n { font-size: 2.1vw; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 3vw; }
  .join { display: flex; align-items: center; gap: 1.6vw; }
  .join img { width: 11vh; height: 11vh; border-radius: 1vh; background: #fff; padding: 0.6vh; }
  .join div { font-size: 1.3vw; color: var(--muted); max-width: 22ch; line-height: 1.4; }
  .count { font-size: 1.4vw; color: var(--muted); }
  .count b { color: var(--text); font-size: 2.4vw; font-weight: 800; }
  .move { position: fixed; inset: 0; background: var(--orange); color: #1A1207; display: none; place-items: center; text-align: center; z-index: 10; }
  .move.on { display: grid; animation: flash 0.5s ease both; }
  .move h1 { font-size: 11vw; letter-spacing: -0.04em; }
  .move p { font-size: 2.4vw; font-weight: 600; margin-top: 1vh; }
  @keyframes flash { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
  .idle { text-align: center; }
  .idle h1 { font-size: 6vw; }
  .idle h1 span { color: var(--orange); display: block; }
  .idle p { font-size: 1.8vw; color: var(--muted); margin-top: 2vh; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="top">
    <div class="brand">Ranna Studios</div>
    <div class="round" id="round">Spin The Wheel — Colors</div>
  </div>

  <div class="middle" id="live" style="display:none">
    <div>
      <div class="clock" id="clock">10:00</div>
      <div class="clock-note" id="clock-note">until the next rotation</div>
    </div>
    <div class="circles" id="circles"></div>
  </div>

  <div class="middle idle" id="idle" style="display:grid;grid-template-columns:1fr">
    <div>
      <h1>Spin The Wheel<span>Colors</span></h1>
      <p id="idle-note">Scan the code, spin for a colour, and go meet the people on that circle.</p>
    </div>
  </div>

  <div class="bottom">
    <div class="join">
      <img id="qr" alt="">
      <div>Scan to join — spin for your colour and find your circle.</div>
    </div>
    <div class="count"><b id="guests">0</b> guests in the room</div>
  </div>
</div>

<div class="move" id="move">
  <div>
    <h1>MOVE</h1>
    <p>Check your phone for your new colour</p>
  </div>
</div>

<script src="/screen.js"></script>
</body>
</html>
